[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decodeforge"
version = "0.1.0"
description = "High-throughput grammar compiler & constrained decoding runtime for production LLM serving"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Dev Tyagi", email = "devtyagi3909@gmail.com" }
]
keywords = [
    "constrained-decoding",
    "grammar-compiler",
    "llm",
    "vllm",
    "sglang",
    "inference",
    "speculative-decoding",
    "structured-generation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
decodeforge = "decodeforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/devtyagi3909/decodeforge"
Repository = "https://github.com/devtyagi3909/decodeforge"
Portfolio = "https://devtyagi-ai.netlify.app"
